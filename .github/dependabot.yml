version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # Swift packages embedded in the app targets (the app's own exact-pinned
  # AppKit dependency is managed through project.yml).
  - package-ecosystem: "swift"
    directories:
      - "/meet"
      - "/room/client"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      swift-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
