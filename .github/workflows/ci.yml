name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '51 5 * * 1'  # weekly Monday 05:51 UTC — full suite incl. macOS + app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# CodeQL default setup scans Python and Actions. Swift is excluded because the
# macOS app depends on the private symaira-appkit repository, which the
# repository-level GitHub token cannot clone during CodeQL autobuild.

jobs:
  test:
    strategy:
      matrix:
        # PR gate is ubuntu-only; macOS runs on main pushes and weekly schedule.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        go-version: ["1.26.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        # Floor set to the measured baseline (issue #488: 73.6%) minus a small
        # buffer, so the gate blocks regressions without failing on today's
        # code. Raise COVERAGE_THRESHOLD as coverage improves.
        env:
          COVERAGE_THRESHOLD: "70"
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=coverage.out ./...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${TOTAL}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v total="$TOTAL" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN { exit !(total < threshold) }' \
            && { echo "::error::Coverage ${TOTAL}% is below the ${COVERAGE_THRESHOLD}% gate"; exit 1; }
          echo "Coverage gate passed."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Design-system font guard (no inline role font literals)
        # Issue #352: app text must use .symairaText(role) instead of inline
        # .font(.caption/.headline/...) literals so Dynamic Type scales.
        run: |
          HITS=$(grep -rnE '\.font\(\.(caption|caption2|headline|callout|subheadline|title|title2|title3|body|largeTitle)' Sources/SymDeskApp/ || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            exit 1
          fi

      - name: Corekit manifest pin guard
        # Issue #526: corekit dependency pin must stay aligned across all 6 modules.
        run: ./scripts/check-corekit-pins.sh

      - name: Nested module version guard
        # Issue #535: Go version directive and shared dependency versions must stay aligned across root and nested modules.
        run: ./scripts/check-nested-versions.sh

      - name: Module boundary guard
        # Issue #536: packages outside permitted facades must not import absorbed library internals.
        run: ./scripts/check-module-boundaries.sh

  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # only-new-issues needs the full history to compute the PR base;
          # with the default shallow fetch the action falls back to reporting
          # the whole pre-existing errcheck/gosec backlog (issue #492).
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      # The gate is scoped to lines touched by the current push/PR. The
      # repository has a pre-existing errcheck/gosec backlog (hundreds of
      # findings); gating on the full backlog would require an unrelated mass
      # cleanup, so this starter job instead blocks new regressions while the
      # backlog is worked down separately.
      #
      # The scope comes from --new-from-rev rather than the action's
      # only-new-issues, which fetches the PR patch through the GitHub API.
      # That API refuses diffs over 20,000 lines, and on a refusal the action
      # falls back to reporting the entire backlog — which is what issue #492
      # describes. A consolidation PR that deletes an absorbed tool's
      # duplicated tree crosses that limit easily (PR #507 deleted ~31k
      # lines). --new-from-rev computes the same scope from local git, which
      # the fetch-depth: 0 above already guarantees, and has no size limit.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          only-new-issues: false
          args: >-
            --new-from-rev=${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version consistency across all sources
        run: |
          set -euo pipefail

          # Latest tag (strip leading 'v')
          TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          echo "Current tag version: ${TAG}"

          # 1. project.yml MARKETING_VERSION (macOS + iOS targets)
          for target in SymDesk SymDeskMobile; do
            PM_VERSION=$(grep -A80 "^  $target:" project.yml | grep MARKETING_VERSION | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$PM_VERSION" != "$TAG" ]; then
              echo "::error::project.yml $target MARKETING_VERSION=$PM_VERSION does not match tag $TAG"
              exit 1
            fi
          done
          echo "project.yml MARKETING_VERSION: OK"

          # 2. Home Assistant addon config
          HA_VERSION=$(grep '^version:' home-assistant-addon/symdesk/config.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$HA_VERSION" != "$TAG" ]; then
            echo "::error::HA addon config version=$HA_VERSION does not match tag $TAG"
            exit 1
          fi
          echo "HA addon config version: OK"

          # 3. main.go version default must be empty (no hardcoded version)
          if grep -qE 'var version = "(0|[1-9])' cmd/symdesk/main.go; then
            echo "::error::cmd/symdesk/main.go has a hardcoded version string — use ldflags injection"
            exit 1
          fi
          echo "main.go version default: OK (no hardcoded version)"

          # 4. corekit dependency pin consistency across all 6 go.mod manifests (issue #526)
          ./scripts/check-corekit-pins.sh

          # 5. nested module Go version and shared dependency consistency (issue #535)
          ./scripts/check-nested-versions.sh

          echo "All version sources consistent with tag ${TAG}"


  app:
    if: github.event_name != 'pull_request'  # PR gate = lint + Go tests (ubuntu); app build on main/schedule
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Install xcodegen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Configure access to private Swift package
        env:
          SYMAIRA_APPKIT_TOKEN: ${{ secrets.SYMAIRA_APPKIT_TOKEN }}
        run: |
          while IFS= read -r config_key; do
            git config --local --unset-all "$config_key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          git config --global url."https://danieljustus:${SYMAIRA_APPKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SYMAIRA_APPKIT_TOKEN}" \
            https://api.github.com/repos/danieljustus/symaira-appkit)"
          test "$api_status" = "200"
          git ls-remote https://github.com/danieljustus/symaira-appkit.git HEAD >/dev/null
        
      - name: Build App
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
      - name: Run App and Core Tests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # room/client is a local Swift package embedded by the app (issue #517).
      # The app scheme builds it but does not run its own test target.
      - name: Run Room Module Tests
        run: swift test --package-path room/client

  app-ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Configure access to private Swift package
        env:
          SYMAIRA_APPKIT_TOKEN: ${{ secrets.SYMAIRA_APPKIT_TOKEN }}
        run: |
          while IFS= read -r config_key; do
            git config --local --unset-all "$config_key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          git config --global url."https://danieljustus:${SYMAIRA_APPKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SYMAIRA_APPKIT_TOKEN}" \
            https://api.github.com/repos/danieljustus/symaira-appkit)"
          test "$api_status" = "200"
          git ls-remote https://github.com/danieljustus/symaira-appkit.git HEAD >/dev/null

      - name: Resolve pinned simulator device
        id: sim
        run: |
          set -euo pipefail
          # Pin to one specific, already-installed plain "iPhone N" simulator
          # instance (no Pro/Plus/Max/mini/e variant, no destination string
          # left generic) rather than a hardcoded OS version or model name.
          # Hosted macOS runner images rotate their installed device roster
          # frequently, so resolve the newest available plain iPhone at run
          # time instead of guessing one that will eventually go stale.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)") || true
          if [ -z "$UDID" ]; then
            echo "::error::No available plain 'iPhone N' simulator found on this runner image. Update the device-matching logic in .github/workflows/ci.yml to match a device from 'xcrun simctl list devices available'."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build SymDeskMobile
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run SymDeskMobileTests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
