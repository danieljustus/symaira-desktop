name: History lifetime native diagnostic
on:
  push:
    branches: [codex/history-lifetime-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-lifetime-native-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: History lifetime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Execute complete Go health, history and vault packages
        run: |
          umask 022
          race_args=(-race)
          if [[ '${{ matrix.os }}' == 'windows-11-arm' ]]; then
            race_args=() # The Go race detector does not support Windows ARM64.
          fi
          go test "${race_args[@]}" -count=3 ./internal/health ./internal/history ./internal/vault
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Execute native Rust vault and volume-prefix regressions
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo +1.98.0 test -p symdesk-vault --locked --lib
      - name: Replay all frozen Go history contracts in Rust
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo +1.98.0 test -p symdesk-vault --locked --test history_contracts --test history_lifecycle_contracts --test history_prune_contracts --test history_purge_contracts --test history_trash_purge_contracts
      - name: Replay real native Go history operations
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          umask 022
          go run ./scripts/rust-port/cmd/historygen --output native-history-oracle.json
          SYMDESK_HISTORY_ORACLE="$PWD/native-history-oracle.json" cargo +1.98.0 test -p symdesk-vault --locked --test history_contracts test_history_live_differential_against_go_oracle -- --ignored --exact
