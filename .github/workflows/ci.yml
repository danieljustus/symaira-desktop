name: Native dataset rejection diagnostic
on:
  push:
    branches: [codex/dataset-rejections-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Dataset rejection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Materialize pinned Go oracle for source guards
        shell: bash
        run: 'git fetch --no-tags origin +38891d35eb8ceb6c348eca9a78b3fb2873677e3d:refs/heads/rust-port-oracle-38891d35eb8ceb6c348eca9a78b3fb2873677e3d

          git fetch --no-tags origin +69e0e149671611563e1fdf7ab636bbba09582844:refs/heads/rust-port-oracle-69e0e149671611563e1fdf7ab636bbba09582844

          git fetch --no-tags origin +3c1ef32f7de92420a972d34f6067a9b5f2de63c9:refs/heads/rust-port-oracle-3c1ef32f7de92420a972d34f6067a9b5f2de63c9

          git fetch --no-tags origin +9b0bf8bda0e1b56eaf5e2766b00850b466d8021e:refs/heads/rust-port-oracle-9b0bf8bda0e1b56eaf5e2766b00850b466d8021e

          '
      - name: Install pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Execute combined native dataset differential
        shell: bash
        run: |
          umask 022
          make dataset-sync-differential CARGO='cargo +1.98.0'
      - name: Verify shared native retention error presentation
        shell: bash
        run: cargo +1.98.0 test -p symdesk-vault --test retention_contracts --test retention_rules_contracts --test retention_state_contracts --locked
