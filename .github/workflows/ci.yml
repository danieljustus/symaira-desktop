name: Current native repair diagnostic
on:
  push:
    branches: [codex/native-current-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native repair (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Materialize pinned Go oracle for source guards
        shell: bash
        run: 'git fetch --no-tags origin +38891d35eb8ceb6c348eca9a78b3fb2873677e3d:refs/heads/rust-port-oracle-38891d35eb8ceb6c348eca9a78b3fb2873677e3d

          git fetch --no-tags origin +69e0e149671611563e1fdf7ab636bbba09582844:refs/heads/rust-port-oracle-69e0e149671611563e1fdf7ab636bbba09582844

          git fetch --no-tags origin +3c1ef32f7de92420a972d34f6067a9b5f2de63c9:refs/heads/rust-port-oracle-3c1ef32f7de92420a972d34f6067a9b5f2de63c9

          git fetch --no-tags origin +9b0bf8bda0e1b56eaf5e2766b00850b466d8021e:refs/heads/rust-port-oracle-9b0bf8bda0e1b56eaf5e2766b00850b466d8021e

          '
      - name: Install pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Replay native Go Ask and Search handlers
        shell: bash
        run: |
          umask 022
          go test -count=3 ./internal/mcp ./internal/service ./internal/sidecar -run '^Test(AskOfflineMCPOracle|SearchHybridMCPOracle|AskHybridOfflineOracle|SearchCLIHybridOracle|MetadataReplacementWaitsForWindowsReader|MetadataReplacementPreservesRecordOnWindowsTimeout)$'
      - name: Replay the full current native Rust workspace
        shell: bash
        run: |
          umask 022
          cargo +1.98.0 test --workspace --all-features --locked
      - name: Compare actual representative Windows CLI responses
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin/port
          go build -ldflags "-X main.version=0.12.2" -o bin/port/symdesk-go.exe ./cmd/symdesk
          SYMDESK_VERSION=0.12.2 cargo +1.98.0 build -p symdesk-cli --locked
          go run ./scripts/rust-port/cmd/diffharness --show-mismatch-output --symdesk-left bin/port/symdesk-go.exe --symdesk-right target/debug/symdesk.exe --cases testdata/port/representative/cases.json --stage representative
      - name: Record three fresh current-build Mac samples
        if: runner.os == 'macOS'
        env:
          SYMDESK_NATIVE_RECORD: ${{ runner.temp }}/native-record-current
          NATIVE_RECORD_TEMP_ROOT: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: make native-record
      - name: Retain native version evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-native-record-${{ matrix.os }}
          path: ${{ runner.temp }}/native-record-current
          retention-days: 14
          if-no-files-found: warn
