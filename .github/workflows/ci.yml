name: Markdown attachment native diagnostic
on:
  push:
    branches: [codex/markdown-health-six-platforms]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markdown-health-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: Markdown attachments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Materialize existing pinned source guards
        run: |
          for sha in 38891d35eb8ceb6c348eca9a78b3fb2873677e3d 69e0e149671611563e1fdf7ab636bbba09582844 3c1ef32f7de92420a972d34f6067a9b5f2de63c9 9b0bf8bda0e1b56eaf5e2766b00850b466d8021e; do
            git fetch --no-tags origin "$sha:refs/heads/rust-port-oracle-$sha"
          done
      - name: Execute real Go attachment health and existing wikilink checks
        run: go test -race -count=1 ./internal/health -run 'Test(MarkdownAttachment|HealthLink|Scan)'
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Replay all Go-owned Markdown health cases in Rust
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo +1.98.0 test -p symdesk-vault --test health_links_contracts
