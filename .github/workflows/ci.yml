name: Service history ownership native diagnostic
on:
  push:
    branches: [codex/service-history-lifetime-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-history-lifetime-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: Service history lifetime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Prove ownership regressions fail against the old Go Service
        run: |
          umask 022
          python3 - <<'CONTROL'
          from pathlib import Path
          import subprocess
          path = Path('internal/service/service.go')
          fixed = path.read_bytes()
          old = subprocess.check_output(['git', 'show', 'dbd4d6ae4f9866681331af95cc589faa68e9c468:internal/service/service.go'])
          try:
              path.write_bytes(old)
              result = subprocess.run(['go','test','-count=1','./internal/service','-run','^TestServiceClose(ReleasesOwnedHistory|BeforeHistoryUsePreventsLateRoot|PreservesBorrowedHistory)$'],capture_output=True,text=True)
              print(result.stdout)
              print(result.stderr)
              assert result.returncode != 0, 'old Service unexpectedly passes'
              for failure in ['owned history remained usable','closed service opened a late history root','replaced owned history was not released']:
                  assert failure in result.stdout, 'ownership counterexample did not execute: '+failure
          finally:
              path.write_bytes(fixed)
          CONTROL
      - name: Verify owned history closes and borrowed history remains usable
        run: |
          umask 022
          race_args=(-race)
          if [[ '${{ matrix.os }}' == 'windows-11-arm' ]]; then
            race_args=()
          fi
          go test "${race_args[@]}" -count=3 ./internal/service -run '^(TestServiceClose.*|TestNewWithRetrievalClientClose.*|TestServicePool.*)$'
          git diff --exit-code -- internal/service/service.go internal/service/history_lifetime_test.go
