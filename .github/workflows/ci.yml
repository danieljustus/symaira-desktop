name: Windows volume prefix parity native diagnostic
on:
  push:
    branches: [codex/volume-prefix-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volume-prefix-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: Volume prefix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Execute real Go native volume and confinement cases
        run: |
          umask 022
          race_args=(-race)
          if [[ '${{ matrix.os }}' == 'windows-11-arm' ]]; then
            race_args=()
          fi
          go test "${race_args[@]}" -count=3 ./internal/vault -run '^TestSecurePath'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Prove native Windows tests reject the previous Rust implementation
        if: runner.os == 'Windows'
        run: |
          python3 - <<'CONTROL'
          from pathlib import Path
          import subprocess
          path = Path('crates/symdesk-vault/src/paths.rs')
          fixed = path.read_text()
          old = subprocess.check_output(['git', 'show', 'bd8ca9948ef56057c5ac7d0599c97e8c5e7c37c5:crates/symdesk-vault/src/paths.rs'], text=True)
          marker = '#[cfg(test)]'
          assert marker in old and marker in fixed
          try:
              path.write_text(old.partition(marker)[0] + marker + fixed.partition(marker)[2])
              result = subprocess.run(['cargo', '+1.98.0', 'test', '-p', 'symdesk-vault', '--locked', '--lib', 'paths::tests::native_volume_coordinates_follow_go_confinement'], capture_output=True, text=True)
              print(result.stdout)
              print(result.stderr)
              assert result.returncode != 0, 'previous implementation unexpectedly passes'
              assert 'paths::tests::native_volume_coordinates_follow_go_confinement ... FAILED' in result.stdout, 'counterexample did not execute'
          finally:
              path.write_text(fixed)
          CONTROL
      - name: Execute fixed Rust native volume and confinement cases
        run: cargo +1.98.0 test -p symdesk-vault --locked --lib
