name: Search and Ask canonical alias native diagnostic
on:
  push:
    branches: [codex/search-ask-alias-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-ask-alias-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    name: Search Ask alias (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Replay Go and Rust CLI MCP search Ask against both temp-root spellings
        run: |
          umask 022
          python3 - <<'REPLAY'
          import hashlib, os, pathlib, subprocess, tempfile
          def evidence():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('testdata/port').rglob('*') if p.is_file()}
          before = evidence()
          with tempfile.TemporaryDirectory(prefix='symdesk-alias-native-') as private:
              root = pathlib.Path(private).resolve()
              actual = root / 'actual'
              actual.mkdir()
              alias = root / 'alias'
              alias.symlink_to(actual, target_is_directory=True)
              assert alias.is_symlink() and alias.resolve() == actual
              for label, temp in [('canonical', actual), ('alias', alias)]:
                  env = os.environ.copy()
                  env.update(TMPDIR=str(temp), TMP=str(temp), TEMP=str(temp))
                  commands = [
                      ['go','test','-race','-count=3','./internal/service','-run','^(TestSearchCLIHybridOracle|TestAskHybridOfflineOracle|TestSearchAliasRoot.*)$'],
                      ['go','test','-race','-count=3','./internal/mcp','-run','^(TestSearchHybridMCPOracle|TestAskOfflineMCPOracle)$'],
                      ['cargo','+1.98.0','test','-p','symdesk-cli','--locked','--test','search_hybrid','--test','ask_offline','--test','mcp_search_hybrid','--test','mcp_ask_offline'],
                  ]
                  for command in commands:
                      print(label, ' '.join(command), flush=True)
                      subprocess.run(command, env=env, check=True)
          assert before == evidence(), 'oracle evidence changed during alias replay'
          REPLAY
