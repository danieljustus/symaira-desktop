# Disposable native diagnostic branch only. Never merge this workflow overlay.
# The complete CI workflow and acceptance run remain unchanged on the candidate.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-checkout-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle-checkout-diagnostic:
    name: Oracle checkout diagnostic (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out pristine original candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 80d6bedc8dc8d2252eb027d57b184c3b9ba55226
          fetch-depth: 0
          path: baseline
          persist-credentials: false
      - name: Check out corrected diagnostic helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fe36f9747beb04ea0ca163265a9731f358e0223d
          fetch-depth: 0
          path: corrected
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache-dependency-path: corrected/go.sum
      - name: Record exact execution identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-checkout-diagnostic"
          test "$(git -C baseline rev-parse HEAD)" = 80d6bedc8dc8d2252eb027d57b184c3b9ba55226
          test "$(git -C corrected rev-parse HEAD)" = fe36f9747beb04ea0ca163265a9731f358e0223d
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C corrected status --porcelain)"
          git -C baseline rev-parse HEAD > "$RUNNER_TEMP/oracle-checkout-diagnostic/baseline-head.txt"
          git -C corrected rev-parse HEAD > "$RUNNER_TEMP/oracle-checkout-diagnostic/corrected-head.txt"
          go version > "$RUNNER_TEMP/oracle-checkout-diagnostic/go-version.txt"
          python3 -c 'import platform; print(platform.system()); print(platform.machine())' > "$RUNNER_TEMP/oracle-checkout-diagnostic/host.txt"
      - name: Pristine original clone control
        id: baseline
        continue-on-error: true
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/rust-port/test_native_ci_contract.py NativeCIContracts.test_clone_based_source_guards_preserve_verified_canonical_oracle 2>&1 | tee "$RUNNER_TEMP/oracle-checkout-diagnostic/baseline-control.log"
      - name: Corrected native deadline regression
        id: deadline
        working-directory: corrected
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -json -timeout 120s -run '^TestInventoryGitOutputPreservesDeadlineAndProcessError$' ./scripts/rust-port/inventory | tee "$RUNNER_TEMP/oracle-checkout-diagnostic/corrected-deadline.jsonl"
      - name: Corrected native clone control
        id: corrected
        working-directory: corrected
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/rust-port/test_native_ci_contract.py NativeCIContracts.test_clone_based_source_guards_preserve_verified_canonical_oracle 2>&1 | tee "$RUNNER_TEMP/oracle-checkout-diagnostic/corrected-control.log"
      - name: Record diagnostic outcomes without accepting full CI
        if: always()
        shell: bash
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          DEADLINE_OUTCOME: ${{ steps.deadline.outcome }}
          CORRECTED_OUTCOME: ${{ steps.corrected.outcome }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"oracle-checkout-diagnostic"; p.mkdir(exist_ok=True); (p/"outcomes.json").write_text(json.dumps({"baseline":os.environ["BASELINE_OUTCOME"],"deadline":os.environ["DEADLINE_OUTCOME"],"corrected":os.environ["CORRECTED_OUTCOME"],"workflow_head":os.environ["GITHUB_SHA"],"full_ci_acceptance":False},indent=2))'
      - name: Retain diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oracle-checkout-diagnostic-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/oracle-checkout-diagnostic/
          retention-days: 14
          if-no-files-found: error
