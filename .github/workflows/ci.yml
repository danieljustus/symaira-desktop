name: RUST-007 combined native acceptance diagnostic
on:
  push:
    branches: [codex/rust007-combined-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust007-combined-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: RUST-007 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Materialize pinned Go oracle for source guards
        run: |
          git fetch --no-tags origin +38891d35eb8ceb6c348eca9a78b3fb2873677e3d:refs/heads/rust-port-oracle-38891d35eb8ceb6c348eca9a78b3fb2873677e3d
          git fetch --no-tags origin +69e0e149671611563e1fdf7ab636bbba09582844:refs/heads/rust-port-oracle-69e0e149671611563e1fdf7ab636bbba09582844
          git fetch --no-tags origin +e077104b1be0c2c82ddfc64109a46aaeb4a114cf:refs/heads/rust-port-oracle-e077104b1be0c2c82ddfc64109a46aaeb4a114cf
          git fetch --no-tags origin +09245b243154f484d8e14afdc9056b9999dd530d:refs/heads/rust-port-oracle-09245b243154f484d8e14afdc9056b9999dd530d
          git fetch --no-tags origin +7035aab79df453f7e9d5c1a5084ac46e9a39b2a2:refs/heads/rust-port-oracle-7035aab79df453f7e9d5c1a5084ac46e9a39b2a2
          git fetch --no-tags origin +3a8b461ade6fe3682a9d983bae697ad02c411b31:refs/heads/rust-port-oracle-3a8b461ade6fe3682a9d983bae697ad02c411b31
          git fetch --no-tags origin +68095b7eabff2de0e901c90931432b125df7ebc4:refs/heads/rust-port-oracle-68095b7eabff2de0e901c90931432b125df7ebc4
          git fetch --no-tags origin +3c1ef32f7de92420a972d34f6067a9b5f2de63c9:refs/heads/rust-port-oracle-3c1ef32f7de92420a972d34f6067a9b5f2de63c9
          git fetch --no-tags origin +9b0bf8bda0e1b56eaf5e2766b00850b466d8021e:refs/heads/rust-port-oracle-9b0bf8bda0e1b56eaf5e2766b00850b466d8021e

          git fetch --no-tags origin +c58856a486158e30a9d9f2edd411c79c00362cc1:refs/heads/rust-port-oracle-c58856a486158e30a9d9f2edd411c79c00362cc1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Execute every ledger acceptance command and preserve frozen fixtures
        run: |
          umask 022
          python3 - <<'ACCEPTANCE'
          from pathlib import Path
          import datetime, hashlib, json, os, subprocess, time
          ledger=json.loads(Path('docs/rust-port/work-items.json').read_text())
          def find(v):
              if isinstance(v,dict):
                  if v.get('id')=='RUST-007': return v
                  for child in v.values():
                      hit=find(child)
                      if hit: return hit
              if isinstance(v,list):
                  for child in v:
                      hit=find(child)
                      if hit: return hit
          item=find(ledger)
          commands=item['acceptance']
          assert len(commands)==17, commands
          def fixture_hashes():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('testdata/port').rglob('*') if p.is_file()}
          before=fixture_hashes()
          evidence=Path('target/rust007-native')
          evidence.mkdir(parents=True,exist_ok=True)
          results=[]
          for index,command in enumerate(commands,1):
              print(f'::group::Acceptance {index}/{len(commands)}: {command}',flush=True)
              start=time.monotonic()
              result=subprocess.run(['bash','-c','umask 022; '+command])
              results.append({'command':command,'exit_code':result.returncode,'seconds':time.monotonic()-start})
              print(f'::endgroup::',flush=True)
              print(json.dumps(results[-1]),flush=True)
              (evidence/'acceptance.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH'],'results':results},indent=2)+'\n')
          after=fixture_hashes()
          assert before==after, 'acceptance mutated frozen Go fixtures'
          (evidence/'fixtures.json').write_text(json.dumps(before,indent=2)+'\n')
          failures=[r for r in results if r['exit_code']!=0]
          assert not failures, failures
          ACCEPTANCE
      - name: Retain complete native acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust007-${{ matrix.os }}-${{ github.sha }}
          path: target/rust007-native/
          retention-days: 14
          if-no-files-found: warn
