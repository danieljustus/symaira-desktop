name: Approval role transaction native diagnostic
on:
  push:
    branches: [codex/approval-role-native-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approval-role-native-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    name: Approval role transaction (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Execute independent-process role barrier, audit replay and Room contracts
        run: |
          umask 022
          race_args=(-race)
          if [[ '${{ matrix.os }}' == 'windows-11-arm' ]]; then
            race_args=() # Go 1.26 does not support the race detector on Windows ARM64.
          fi
          go test "${race_args[@]}" -count=3 ./internal/room/authorization ./internal/room/approval ./internal/room/room ./internal/room/run ./internal/room/journal
