name: Native oracle diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-oracles:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Replay actual Go Search and Ask oracles
        shell: bash
        run: go test -count=3 ./internal/mcp ./internal/service ./internal/sidecar -run '^Test(AskOfflineMCPOracle|SearchHybridMCPOracle|AskHybridOfflineOracle|SearchCLIHybridOracle|MetadataReplacementWaitsForWindowsReader|MetadataReplacementPreservesRecordOnWindowsTimeout)$'
