name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '51 5 * * 1'  # weekly Monday 05:51 UTC — full suite incl. macOS + app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# CodeQL default setup scans Python and Actions. Swift is excluded because the
# macOS app depends on the private symaira-appkit repository, which the
# repository-level GitHub token cannot clone during CodeQL autobuild.

jobs:
  test:
    strategy:
      matrix:
        # PR gate is ubuntu-only; macOS runs on main pushes and weekly schedule.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        go-version: ["1.26.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # portgen provenance tests read the pinned oracle revision via git.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        # Floor set to the measured baseline (issue #488: 73.6%) minus a small
        # buffer, so the gate blocks regressions without failing on today's
        # code. Raise COVERAGE_THRESHOLD as coverage improves.
        env:
          COVERAGE_THRESHOLD: "70"
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile=coverage.out ./...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${TOTAL}% (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v total="$TOTAL" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN { exit !(total < threshold) }' \
            && { echo "::error::Coverage ${TOTAL}% is below the ${COVERAGE_THRESHOLD}% gate"; exit 1; }
          echo "Coverage gate passed."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Design-system font guard (no inline role font literals)
        # Issue #352: app text must use .symairaText(role) instead of inline
        # .font(.caption/.headline/...) literals so Dynamic Type scales.
        run: |
          HITS=$(grep -rnE '\.font\(\.(caption|caption2|headline|callout|subheadline|title|title2|title3|body|largeTitle)' Sources/SymDeskApp/ || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            exit 1
          fi

      - name: Corekit manifest pin guard
        # Issue #526: corekit dependency pin must stay aligned across all 6 modules.
        run: ./scripts/check-corekit-pins.sh

      - name: Nested module version guard
        # Issue #535: Go version directive and shared dependency versions must stay aligned across root and nested modules.
        run: ./scripts/check-nested-versions.sh

      - name: Module boundary guard
        # Issue #536: packages outside permitted facades must not import absorbed library internals.
        run: ./scripts/check-module-boundaries.sh

  port-contract:
    name: Rust port contract
    strategy:
      matrix:
        # Keep the PR gate fast; full native contract execution runs on main
        # and schedule, including platform-specific process-tree cleanup.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # portgen provenance checks read the pinned oracle revision via git.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Verify frozen Go oracle fixtures and differential harness
        if: matrix.os != 'windows-latest'
        run: make port-contract

      - name: Verify frozen oracle and differential harness on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go run ./scripts/rust-port/cmd/portgen --check
          go test -count=1 ./scripts/rust-port/...
          go build -ldflags "-X main.version=0.12.2" -o bin/symdesk.exe ./cmd/symdesk
          go build -ldflags "-X github.com/danieljustus/symaira-desktop/internal/room/version.Version=0.12.2" -o bin/symroom.exe ./cmd/symroom
          go run ./scripts/rust-port/cmd/diffharness --allow-same-binary --symdesk-left bin/symdesk.exe --symdesk-right bin/symdesk.exe --symroom-left bin/symroom.exe --symroom-right bin/symroom.exe --cases testdata/port/cli/cases.json

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup toolchain install nightly-2026-09-03 --profile minimal

      - name: Install Rust verification tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-hack@0.6.45,cargo-llvm-cov@0.9.0
          fallback: none

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Run Rust gates and Go-to-Rust version differential
        run: make rust-gates

      - name: Fuzz frontmatter parser smoke corpus
        run: make rust-fuzz-smoke

  rust-native:
    name: Rust native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Check, lint, and test Rust workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --doc --all-features --locked

      - name: Run native macOS version differential
        if: matrix.os == 'macos-latest'
        run: make rust-version-contract

      - name: Run native Windows version differential
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin/port | Out-Null
          go build -ldflags "-X main.version=0.12.2" -o bin/port/symdesk-go.exe ./cmd/symdesk
          go build -ldflags "-X github.com/danieljustus/symaira-desktop/internal/room/version.Version=0.12.2" -o bin/port/symroom-go.exe ./cmd/symroom
          $env:SYMDESK_VERSION = "0.12.2"
          $env:SYMROOM_VERSION = "0.12.2"
          cargo build --release --workspace --locked
          go run ./scripts/rust-port/cmd/diffharness --symdesk-left bin/port/symdesk-go.exe --symdesk-right target/release/symdesk.exe --symroom-left bin/port/symroom-go.exe --symroom-right target/release/symroom.exe --cases testdata/port/cli/cases.json --stage version

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Issue #753: fails the job only on vulnerabilities reachable from this
      # module's code (govulncheck's default text summary already excludes
      # unreachable/informational findings; no extra flags needed).
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26.6"

  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # only-new-issues needs the full history to compute the PR base;
          # with the default shallow fetch the action falls back to reporting
          # the whole pre-existing errcheck/gosec backlog (issue #492).
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      # The pre-existing errcheck/gosec backlog (issue #752 and its
      # package-scoped leaves) is cleared, so the gate now covers the full
      # tree instead of only lines touched by the current push/PR.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          only-new-issues: false

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version consistency across all sources
        run: |
          set -euo pipefail

          # Latest tag (strip leading 'v'). During release preparation the
          # next version is intentionally ahead of the latest published tag:
          # release/<version> PRs and their resulting main commit validate
          # against that explicit preparation version instead.
          TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          EXPECTED_VERSION="$TAG"
          if [[ "${GITHUB_HEAD_REF:-}" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            EXPECTED_VERSION="${BASH_REMATCH[1]}"
            echo "Release preparation branch version: ${EXPECTED_VERSION}"
          elif [[ "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            SOURCE_VERSION=$(grep -A80 '^  SymDesk:' project.yml | grep MARKETING_VERSION | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ && "$SOURCE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              IFS=. read -r tag_major tag_minor tag_patch <<< "$TAG"
              IFS=. read -r src_major src_minor src_patch <<< "$SOURCE_VERSION"
              if ((
                (src_major == tag_major && src_minor == tag_minor && src_patch == tag_patch + 1) ||
                (src_major == tag_major && src_minor == tag_minor + 1 && src_patch == 0) ||
                (src_major == tag_major + 1 && src_minor == 0 && src_patch == 0)
              )); then
                EXPECTED_VERSION="$SOURCE_VERSION"
                echo "Pending release source version: ${EXPECTED_VERSION}"
              fi
            fi
          fi
          echo "Current tag version: ${TAG}"
          echo "Expected source version: ${EXPECTED_VERSION}"

          # 1. project.yml MARKETING_VERSION (macOS + iOS targets)
          for target in SymDesk SymDeskMobile; do
            PM_VERSION=$(grep -A80 "^  $target:" project.yml | grep MARKETING_VERSION | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$PM_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::project.yml $target MARKETING_VERSION=$PM_VERSION does not match expected version $EXPECTED_VERSION"
              exit 1
            fi
          done
          echo "project.yml MARKETING_VERSION: OK"

          # 2. Home Assistant addon config
          HA_VERSION=$(grep '^version:' home-assistant-addon/symdesk/config.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$HA_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::HA addon config version=$HA_VERSION does not match expected version $EXPECTED_VERSION"
            exit 1
          fi
          echo "HA addon config version: OK"

          # 3. main.go version default must be empty (no hardcoded version)
          if grep -qE 'var version = "(0|[1-9])' cmd/symdesk/main.go; then
            echo "::error::cmd/symdesk/main.go has a hardcoded version string — use ldflags injection"
            exit 1
          fi
          echo "main.go version default: OK (no hardcoded version)"

          # 4. corekit dependency pin consistency across all 6 go.mod manifests (issue #526)
          ./scripts/check-corekit-pins.sh

          # 5. nested module Go version and shared dependency consistency (issue #535)
          ./scripts/check-nested-versions.sh

          echo "All version sources consistent with ${EXPECTED_VERSION}"


  app:
    if: github.event_name != 'pull_request'  # PR gate = lint + Go tests (ubuntu); app build on main/schedule
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Install xcodegen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Configure access to private Swift package
        env:
          SYMAIRA_APPKIT_TOKEN: ${{ secrets.SYMAIRA_APPKIT_TOKEN }}
        run: |
          while IFS= read -r config_key; do
            git config --local --unset-all "$config_key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          git config --global url."https://danieljustus:${SYMAIRA_APPKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SYMAIRA_APPKIT_TOKEN}" \
            https://api.github.com/repos/danieljustus/symaira-appkit)"
          test "$api_status" = "200"
          git ls-remote https://github.com/danieljustus/symaira-appkit.git HEAD >/dev/null
        
      - name: Build App
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
      - name: Run App and Core Tests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # room/client is a local Swift package embedded by the app (issue #517).
      # The app scheme builds it but does not run its own test target.
      - name: Run Room Module Tests
        run: swift test --package-path room/client

  app-ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Validate iOS release configuration
        run: bash scripts/release-ios.sh --dry-run

      - name: Configure access to private Swift package
        env:
          SYMAIRA_APPKIT_TOKEN: ${{ secrets.SYMAIRA_APPKIT_TOKEN }}
        run: |
          while IFS= read -r config_key; do
            git config --local --unset-all "$config_key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          git config --global url."https://danieljustus:${SYMAIRA_APPKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SYMAIRA_APPKIT_TOKEN}" \
            https://api.github.com/repos/danieljustus/symaira-appkit)"
          test "$api_status" = "200"
          git ls-remote https://github.com/danieljustus/symaira-appkit.git HEAD >/dev/null

      - name: Resolve pinned simulator device
        id: sim
        run: |
          set -euo pipefail
          # Pin to one specific, already-installed plain "iPhone N" simulator
          # instance (no Pro/Plus/Max/mini/e variant, no destination string
          # left generic) rather than a hardcoded OS version or model name.
          # Hosted macOS runner images rotate their installed device roster
          # frequently, so resolve the newest available plain iPhone at run
          # time instead of guessing one that will eventually go stale.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)") || true
          if [ -z "$UDID" ]; then
            echo "::error::No available plain 'iPhone N' simulator found on this runner image. Update the device-matching logic in .github/workflows/ci.yml to match a device from 'xcrun simctl list devices available'."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build SymDeskMobile
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run SymDeskMobileTests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
