  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version consistency across all sources
        run: |
          set -euo pipefail

          # Latest tag (strip leading 'v'). During release preparation the
          # next version is intentionally ahead of the latest published tag:
          # release/<version> PRs and their resulting main commit validate
          # against that explicit preparation version instead.
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          EXPECTED_VERSION="$TAG"
          if [[ "${GITHUB_HEAD_REF:-}" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            EXPECTED_VERSION="${BASH_REMATCH[1]}"
            echo "Release preparation branch version: ${EXPECTED_VERSION}"
          elif [[ "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            SOURCE_VERSION=$(grep -A80 '^  SymDesk:' project.yml | grep MARKETING_VERSION | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ && "$SOURCE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              IFS=. read -r tag_major tag_minor tag_patch <<< "$TAG"
              IFS=. read -r src_major src_minor src_patch <<< "$SOURCE_VERSION"
              if ((
                (src_major == tag_major && src_minor == tag_minor && src_patch == tag_patch + 1) ||
                (src_major == tag_major && src_minor == tag_minor + 1 && src_patch == 0) ||
                (src_major == tag_major + 1 && src_minor == 0 && src_patch == 0)
              )); then
                EXPECTED_VERSION="$SOURCE_VERSION"
                echo "Pending release source version: ${EXPECTED_VERSION}"
              fi
            fi
          fi
          echo "Current tag version: ${TAG}"
          echo "Expected source version: ${EXPECTED_VERSION}"

          # 1. project.yml MARKETING_VERSION (macOS + iOS targets)
          for target in SymDesk SymDeskMobile; do
            PM_VERSION=$(grep -A80 "^  $target:" project.yml | grep MARKETING_VERSION | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$PM_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::project.yml $target MARKETING_VERSION=$PM_VERSION does not match expected version $EXPECTED_VERSION"
              exit 1
            fi
          done
          echo "project.yml MARKETING_VERSION: OK"

          # 2. Home Assistant addon config
          HA_VERSION=$(grep '^version:' home-assistant-addon/symdesk/config.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$HA_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::HA addon config version=$HA_VERSION does not match expected version $EXPECTED_VERSION"
            exit 1
          fi
          echo "HA addon config version: OK"

          echo "All version sources consistent with ${EXPECTED_VERSION}"


  app:
    # Native macOS acceptance remains on main, weekly, and manual suites.
    if: github.event_name != 'pull_request'
    # Xcode test hosts and iOS simulators stay on the hosted image: the
    # MacBook runner's LaunchAgent session cannot host the app test runner
    # and has no iPhone simulator installed.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Prune stale gate worktrees on the persistent self-hosted checkout
        if: runner.environment == 'self-hosted'
        # Stale worktree registrations survive in the kept checkout.
        run: git worktree prune


      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Install xcodegen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify native AppIcon sources
        run: bash scripts/check-app-icons.sh

      - name: Build App
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/SymDesk-macos-derived-data" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Verify compiled macOS AppIcon
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymDesk-macos-derived-data/Build/Products/Debug/SymDesk.app" --platform macOS
        
      - name: Run App and Core Tests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDesk -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/SymDesk-macos-derived-data" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # room/client is a local Swift package embedded by the app (issue #517).
      # The app scheme builds it but does not run its own test target.
      - name: Run Room Module Tests
        run: swift test --package-path room/client

  app-ios:
    # Native iOS acceptance remains on main, weekly, and manual suites.
    if: github.event_name != 'pull_request'
    name: iOS app
    # The MacBook runner has no iPhone simulator; keep the hosted image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Prune stale gate worktrees on the persistent self-hosted checkout
        if: runner.environment == 'self-hosted'
        # Stale worktree registrations survive in the kept checkout.
        run: git worktree prune


      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*|Xcode\ 27.*) ;;
            *) echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION"; exit 1 ;;
          esac

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Validate iOS release configuration
        run: bash scripts/release-ios.sh --dry-run

      - name: Resolve pinned simulator device
        id: sim
        run: |
          set -euo pipefail
          # Pin to one specific, already-installed plain "iPhone N" simulator
          # instance (no Pro/Plus/Max/mini/e variant, no destination string
          # left generic) rather than a hardcoded OS version or model name.
          # Hosted macOS runner images rotate their installed device roster
          # frequently, so resolve the newest available plain iPhone at run
          # time instead of guessing one that will eventually go stale.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,re,sys; data=json.load(sys.stdin); cands=sorted(((int(m.group(1)), d['udid']) for lst in data['devices'].values() for d in lst for m in [re.fullmatch(r'iPhone (\d+)', d['name'])] if m), reverse=True); print(cands[0][1]) if cands else sys.exit(1)") || true
          if [ -z "$UDID" ]; then
            echo "::error::No available plain 'iPhone N' simulator found on this runner image. Update the device-matching logic in .github/workflows/ci.yml to match a device from 'xcrun simctl list devices available'."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Verify native AppIcon sources
        run: bash scripts/check-app-icons.sh

      - name: Build SymDeskMobile
        run: xcodebuild build -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/SymDesk-ios-derived-data" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Verify compiled iOS AppIcon
        run: bash scripts/check-app-icons.sh --bundle "$RUNNER_TEMP/SymDesk-ios-derived-data/Build/Products/Debug-iphonesimulator/SymDesk.app" --platform iOS

      - name: Run SymDeskMobileTests
        run: xcodebuild test -project SymDesk.xcodeproj -scheme SymDeskMobile -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/SymDesk-ios-derived-data" -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
