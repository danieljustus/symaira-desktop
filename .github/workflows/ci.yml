name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '51 5 * * 1'  # weekly Monday 05:51 UTC — full suite incl. macOS + app
    - cron: '17 2 * * *'  # nightly 02:17 UTC — main-equivalent suite on supported platforms

# Scheduled runs get a unique group so a main push cannot cancel the nightly
# native evidence run (and vice versa); push/PR behaviour is unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# Swift remains excluded from CodeQL default setup; native app jobs below
# verify the macOS and iOS builds against the pinned public AppKit package.

jobs:
  decide:
    name: Select macOS capacity
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/macos-runner.yml
    secrets:
      RUNNER_INVENTORY_TOKEN: ${{ secrets.RUNNER_INVENTORY_TOKEN }}
    with:
      hosted: macos-26

  lint:
    # Swift design-system guard. Rust fmt/clippy run in the `rust` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Design-system font guard (no inline role font literals)
        # Issue #352: app text must use .symairaText(role) instead of inline
        # .font(.caption/.headline/...) literals so Dynamic Type scales.
        run: |
          HITS=$(grep -rnE '\.font\(\.(caption|caption2|headline|callout|subheadline|title|title2|title3|body|largeTitle)' Sources/SymDeskApp/ || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            exit 1
          fi

  port-contract:
    # Go-free: fixture provenance checksums plus the frozen replay of every
    # Go-recorded fixture (make port-contract). Retained on main, weekly and
    # manual suites.
    if: github.event_name != 'pull_request'
    name: Rust port contract
    strategy:
      fail-fast: false
      matrix:
        # Exercise the portable source and oracle contracts on every native runner.
        # Supported native targets on push, schedule, and workflow_dispatch.
        # Ubuntu 24.04 on purpose: the hostile PDF recording binds its qpdf and
        # Poppler versions (also the local gate image).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    needs: [decide]
    runs-on: ${{ fromJSON(matrix.os == 'macos-latest' && needs.decide.outputs.runs_on || toJSON(matrix.os)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          # The oracle bundle's prerequisite commit and the last Go commit
          # (36aad3d4) must be present for --history checks and bundle replays.
          fetch-depth: 0
      - name: Prune stale gate worktrees on the persistent self-hosted checkout
        if: runner.environment == 'self-hosted'
        # Stale worktree registrations survive in the kept checkout.
        run: git worktree prune


      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      # The render contracts measure their output with Poppler, qpdf and the
      # pinned Typst.
      - name: Install the render contract tools
        run: scripts/rust-port/install-render-tools.sh

      - name: Verify fixture provenance and replay the frozen Go oracle fixtures
        run: make port-contract

      - name: Bind recorded Go source hashes to the last Go commit
        run: make port-provenance-history

  rust:
    # RUST-019: the Go gates are gone, so the full Rust gates are the PR path too.
    name: Rust
    # Ubuntu 24.04 on purpose: the hostile PDF recording binds its qpdf and
    # Poppler versions (also the local gate image).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Historical evidence gates compare immutable prior revisions.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup toolchain install nightly-2026-09-03 --profile minimal

      # The render contracts measure their output with Poppler, qpdf and the
      # pinned Typst.
      - name: Install the render contract tools
        run: scripts/rust-port/install-render-tools.sh

      - name: Install Rust verification tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-hack@0.6.45,cargo-llvm-cov@0.9.0
          fallback: none

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Run Rust gates, version differential, and historical evidence tests
        env:
          # The Makefile default assumes the developer's attached external NVMe
          # (/Volumes/1TB_NVMe_SN850X/...), which does not exist on hosted
          # runners; point VALUE-001's runtime root at the runner's own
          # writable temp dir instead.
          VALUE_RUNTIME_ROOT: ${{ runner.temp }}/symaira-desktop-value001-ci
        run: make rust-gates value-001-evidence-tests

      - name: Fuzz frontmatter and room event smoke corpora
        run: make rust-fuzz-smoke

  frozen-contract:
    # Issue #1153 / RUST-019: the Rust contract suite protects the port without
    # Go; this job proves it by removing any preinstalled Go toolchain.
    if: github.event_name != 'pull_request'
    name: Rust frozen contract (no Go)
    # Ubuntu 24.04 on purpose: the hostile PDF recording binds its qpdf and
    # Poppler versions (also the local gate image).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The recorded oracle bundle's prerequisite commit must be present.
          fetch-depth: 0

      - name: Remove any preinstalled Go toolchain
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6 7 8; do
            go_bin="$(command -v go)" || break
            sudo rm -f "$(readlink -f "$go_bin")" "$go_bin"
            hash -r
          done
          if command -v go; then exit 1; fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      # The render contracts measure their output with Poppler, qpdf and the
      # pinned Typst.
      - name: Install the render contract tools
        run: scripts/rust-port/install-render-tools.sh

      - name: Replay frozen Go oracle fixtures without Go
        run: make port-contract-frozen

  rust-miri:
    # CORE-002/003 Miri lane: runs only the core_contracts replay, scoped to the
    # pinned nightly (keep in sync with RUST_NIGHTLY in the Makefile and the
    # Dockerfile of scripts/rust-port/local-gate). Advisory like the Rust lane.
    if: github.event_name != 'pull_request'
    name: Miri CORE contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain and nightly with Miri
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup toolchain install nightly-2026-09-03 --profile minimal --component miri,rust-src

      - name: Run Miri on CORE contracts
        run: make rust-miri

  rust-native:
    name: Rust native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Supported native targets on push, schedule, and workflow_dispatch.
        # Ubuntu 24.04 on purpose: the hostile PDF recording binds its qpdf and
        # Poppler versions (also the local gate image).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    needs: [decide]
    runs-on: ${{ fromJSON(matrix.os == 'macos-latest' && needs.decide.outputs.runs_on || toJSON(matrix.os)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          # Detach even on main pushes; the gate owns an exact-SHA temporary branch.
          ref: ${{ github.sha }}
          # Replays read the embedded oracle bundle and the last Go commit.
          fetch-depth: 0
      - name: Prune stale gate worktrees on the persistent self-hosted checkout
        if: runner.environment == 'self-hosted'
        # Stale worktree registrations survive in the kept checkout.
        run: git worktree prune


      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      # The render contracts measure their output with Poppler, qpdf and the
      # pinned Typst.
      - name: Install the render contract tools
        run: scripts/rust-port/install-render-tools.sh

      - name: Replay native contacts and ingest path contracts
        shell: bash
        env:
          SYMDESK_CFG_CAPTURE_DIR: ${{ runner.temp }}/config-store-paths
        run: |
          set -euo pipefail
          cargo test -p symdesk-core --test store_paths --locked -- --nocapture

      - name: Retain native configuration path evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: config-store-paths-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/config-store-paths
          retention-days: 14
          if-no-files-found: error

      - name: Check, lint, and test Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked --no-fail-fast
          cargo test --workspace --doc --all-features --locked

      - name: Run native vault write differential
