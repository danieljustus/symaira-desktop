name: Container

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker-entrypoint.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - internal/**
      - scripts/release/container-smoke.sh
      - .github/workflows/container.yml


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/danieljustus/symaira-desktop

jobs:
  # The Rust build stage is too slow under QEMU, so each architecture builds
  # natively. Branch and PR runs load the image and smoke-test it; a release
  # tag pushes per-platform digests that the merge job combines into one
  # multi-platform manifest.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, slug: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, slug: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
      - name: Image version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ !startsWith(github.ref, 'refs/tags/v') && format('symdesk-smoke:{0}', matrix.slug) || '' }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
      - name: Smoke test the image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/release/container-smoke.sh "symdesk-smoke:${{ matrix.slug }}" dev
      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
      - name: Create and push the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}"
