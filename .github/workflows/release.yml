name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer marketing version for a manually triggered build'
        required: false
        type: string
      build_number:
        description: 'Positive App Store build number (defaults to the workflow run number)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-cli:
    name: Signed CLI release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      id-token: write # required for keyless Cosign signing via GitHub OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the configured certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Install Cosign
        # v2.4.3 supports the separate .sig/.pem outputs required by the
        # release asset contract while obtaining its signing identity from OIDC.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Verify CLI reports the release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY=$(find dist -type f -name symdesk -path "*darwin_arm64*" | head -1)
          test -n "$BINARY"
          OUTPUT=$("$BINARY" version)
          echo "$OUTPUT"
          if [ "$OUTPUT" != "symdesk ${VERSION}" ]; then
            echo "::error::CLI version mismatch: expected 'symdesk ${VERSION}', got '$OUTPUT'."
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  release-macos-app:
    name: Signed and notarized SymDesk app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    needs: release-cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the configured certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install app packaging tools
        run: |
          set -euo pipefail
          brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -project SymDesk.xcodeproj \
            -scheme SymDesk \
            -resolvePackageDependencies

      - name: Archive SymDesk.app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project SymDesk.xcodeproj \
            -scheme SymDesk \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SymDesk.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Verify app reports the release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          PLIST_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Contents/Info.plist")
          echo "CFBundleShortVersionString: $PLIST_VERSION"
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error::App bundle version mismatch: expected '$VERSION', got '$PLIST_VERSION'."
            exit 1
          fi
          OUTPUT=$("$APP_PATH/Contents/MacOS/SymDesk" --version)
          echo "$OUTPUT"
          if [ "$OUTPUT" != "symdesk version ${VERSION}" ]; then
            echo "::error::App executable version mismatch: expected 'symdesk version ${VERSION}', got '$OUTPUT'."
            exit 1
          fi

      - name: Sign and verify app bundle
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          test -d "$APP_PATH"
          while IFS= read -r -d '' item; do
            if file "$item" | grep -q "Mach-O"; then
              codesign --force --sign "$CODESIGN_IDENTITY" --timestamp --options runtime "$item"
            fi
          done < <(find "$APP_PATH/Contents" -type f -print0)
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp --options runtime "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for secret in NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" | base64 --decode -o "$API_KEY_PATH"

          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          SUBMISSION_ARCHIVE="$RUNNER_TEMP/SymDesk-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$SUBMISSION_ARCHIVE"
          xcrun notarytool submit "$SUBMISSION_ARCHIVE" \
            -d "$NOTARY_API_KEY_ID" \
            -i "$NOTARY_API_ISSUER_ID" \
            -k "$API_KEY_PATH" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package release assets
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg-staging
          cp -R "$APP_PATH" dist/dmg-staging/
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/SymDesk-${VERSION}.zip"
          ./scripts/create-symaira-dmg.sh \
            "$APP_PATH" \
            "dist/Symaira-Desktop-${VERSION}-macos.dmg" \
            "Symaira Desktop"

      - name: Sign, notarize, staple, and verify DMG
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="dist/Symaira-Desktop-${VERSION}-macos.dmg"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" | base64 --decode -o "$API_KEY_PATH"
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            -d "$NOTARY_API_KEY_ID" \
            -i "$NOTARY_API_ISSUER_ID" \
            -k "$API_KEY_PATH" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d ' ' -f 1)"
          test -n "$DMG_SHA256"
          echo "DMG_SHA256=$DMG_SHA256" >> "$GITHUB_ENV"

      - name: Upload app artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/SymDesk-*.zip
            dist/Symaira-Desktop-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Redownload and verify published DMG bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="Symaira-Desktop-${VERSION}-macos.dmg"
          PUBLISHED_DIR="$RUNNER_TEMP/published-dmg"
          rm -rf "$PUBLISHED_DIR"
          mkdir -p "$PUBLISHED_DIR"
          gh release download "$GITHUB_REF_NAME" --pattern "$NAME" --dir "$PUBLISHED_DIR"
          PUBLISHED_DMG="$PUBLISHED_DIR/$NAME"
          test -f "$PUBLISHED_DMG"
          PUBLISHED_SHA256="$(shasum -a 256 "$PUBLISHED_DMG" | cut -d ' ' -f 1)"
          test "$PUBLISHED_SHA256" = "$DMG_SHA256"
          codesign --verify --strict --verbose=2 "$PUBLISHED_DMG"
          xcrun stapler validate "$PUBLISHED_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$PUBLISHED_DMG"

      - name: Upload app artifacts to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SymDesk-macos
          path: |
            dist/SymDesk-*.zip
            dist/Symaira-Desktop-*.dmg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  release-ios-testflight:
    name: Signed iOS TestFlight build
    runs-on: macos-15
    environment: ios-testflight
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.0'

      - name: Verify Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          echo "$XCODE_VERSION"
          case "$XCODE_VERSION" in
            Xcode\ 26.*) ;;
            *)
              echo "::error::Expected Xcode 26.x, got: $XCODE_VERSION"
              exit 1
              ;;
          esac

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Validate iOS release configuration
        run: bash scripts/release-ios.sh --dry-run

      - name: Configure access to private Swift package
        env:
          SYMAIRA_APPKIT_TOKEN: ${{ secrets.SYMAIRA_APPKIT_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r config_key; do
            git config --local --unset-all "$config_key" || true
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          git config --global url."https://danieljustus:${SYMAIRA_APPKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SYMAIRA_APPKIT_TOKEN}" \
            https://api.github.com/repos/danieljustus/symaira-appkit)"
          test "$api_status" = "200"
          git ls-remote https://github.com/danieljustus/symaira-appkit.git HEAD >/dev/null

      - name: Import iOS distribution certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Download main app provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: com.symaira.desktop.ios
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download Share Extension provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: com.symaira.desktop.ios.share
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download Widget provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: com.symaira.desktop.ios.widget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Set release version and build number
        env:
          IOS_RELEASE_VERSION: ${{ inputs.version }}
          IOS_RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          VERSION="${IOS_RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          BUILD_NUMBER="${IOS_RELEASE_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Provide a SemVer version through the tag or workflow_dispatch input 'version'."
            exit 2
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Build number must be a positive integer."
            exit 2
          }
          echo "IOS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using iOS version $VERSION and build number $BUILD_NUMBER"

      - name: Archive and export iOS product
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bash scripts/release-ios.sh \
            --archive-path "$RUNNER_TEMP/SymDeskMobile.xcarchive" \
            --export-path "$RUNNER_TEMP/ios-export"

      - name: Locate exported IPA
        run: |
          set -euo pipefail
          shopt -s nullglob
          IPAS=("$RUNNER_TEMP/ios-export"/*.ipa)
          shopt -u nullglob
          test "${#IPAS[@]}" -eq 1
          echo "IOS_IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Exported IPA: $(basename "${IPAS[0]}")"

      - name: Upload IPA, dSYMs, and archive as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SymDesk-iOS-${{ github.run_number }}
          path: |
            ${{ env.IOS_IPA_PATH }}
            ${{ runner.temp }}/SymDeskMobile.xcarchive/dSYMs
          if-no-files-found: error

      - name: Upload build to TestFlight
        uses: Apple-Actions/upload-testflight-build@5e75ff58276689011512ba87a381d93dc67dbcf8 # v5.3.0
        with:
          app-path: ${{ env.IOS_IPA_PATH }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'

  bump-homebrew-cask:
    name: Bump Homebrew cask
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    needs: release-macos-app
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Download release DMG and compute checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/danieljustus/symaira-desktop/releases/download/${GITHUB_REF_NAME}/Symaira-Desktop-${VERSION}-macos.dmg"
          curl -fsSL -o "Symaira-Desktop-${VERSION}-macos.dmg" "$DMG_URL"
          SHA256=$(shasum -a 256 "Symaira-Desktop-${VERSION}-macos.dmg" | awk '{print $1}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Write cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/symdesk-app.rb <<EOF
          cask "symdesk-app" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/danieljustus/symaira-desktop/releases/download/v#{version}/Symaira-Desktop-#{version}-macos.dmg"
            name "Symaira Desktop"
            desc "Local-first markdown vault workspace"
            homepage "https://github.com/danieljustus/symaira-desktop"

            livecheck do
              url "https://github.com/danieljustus/symaira-desktop/releases/latest"
              strategy :header_match
              regex(/Symaira-Desktop-(\d+(?:\.\d+)*)-macos\.dmg/i)
            end

            depends_on macos: :sonoma

            app "SymDesk.app"

            zap trash: [
              "~/Library/Application Support/SymDesk",
              "~/Library/Preferences/com.symaira.desktop.plist",
              "~/Library/Caches/com.symaira.desktop",
            ]
          end
          EOF

      - name: Commit and push cask
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symdesk-app.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump symdesk-app to v${VERSION}"
          git push
