name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-cli:
    name: Signed CLI release
    runs-on: macos-15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the configured certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  release-macos-app:
    name: Signed and notarized SymDesk app
    runs-on: macos-15
    environment: release
    needs: release-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the configured certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install app packaging tools
        run: |
          set -euo pipefail
          brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -project SymDesk.xcodeproj \
            -scheme SymDesk \
            -resolvePackageDependencies

      - name: Archive SymDesk.app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project SymDesk.xcodeproj \
            -scheme SymDesk \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SymDesk.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY"

      - name: Sign and verify app bundle
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          test -d "$APP_PATH"
          while IFS= read -r -d '' item; do
            if file "$item" | grep -q "Mach-O"; then
              codesign --force --sign "$CODESIGN_IDENTITY" --timestamp --options runtime "$item"
            fi
          done < <(find "$APP_PATH/Contents" -type f -print0)
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp --options runtime "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for secret in NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret must be configured in the release environment."
              exit 1
            fi
          done

          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" > "$API_KEY_PATH"

          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          SUBMISSION_ARCHIVE="$RUNNER_TEMP/SymDesk-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$SUBMISSION_ARCHIVE"
          xcrun notarytool submit "$SUBMISSION_ARCHIVE" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer-id "$NOTARY_API_ISSUER_ID" \
            --key-path "$API_KEY_PATH" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package release assets
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SymDesk.xcarchive/Products/Applications/SymDesk.app"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg-staging
          cp -R "$APP_PATH" dist/dmg-staging/
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/SymDesk-${VERSION}.zip"
          create-dmg \
            --volname "SymDesk" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "SymDesk.app" 175 120 \
            --hide-extension "SymDesk.app" \
            --app-drop-link 425 120 \
            "dist/SymDesk-${VERSION}.dmg" \
            dist/dmg-staging/

      - name: Notarize and staple DMG
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="dist/SymDesk-${VERSION}.dmg"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_API_KEY" > "$API_KEY_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer-id "$NOTARY_API_ISSUER_ID" \
            --key-path "$API_KEY_PATH" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Upload app artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SymDesk-*.zip
            dist/SymDesk-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload app artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: SymDesk-macos
          path: |
            dist/SymDesk-*.zip
            dist/SymDesk-*.dmg
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  bump-homebrew-cask:
    name: Bump Homebrew cask
    runs-on: macos-15
    environment: release
    needs: release-macos-app
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: danieljustus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release DMG and compute checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/danieljustus/symaira-desktop/releases/download/${GITHUB_REF_NAME}/SymDesk-${VERSION}.dmg"
          curl -fsSL -o "SymDesk-${VERSION}.dmg" "$DMG_URL"
          SHA256=$(shasum -a 256 "SymDesk-${VERSION}.dmg" | awk '{print $1}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Write cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/symdesk-app.rb <<EOF
          cask "symdesk-app" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/danieljustus/symaira-desktop/releases/download/v#{version}/SymDesk-#{version}.dmg"
            name "SymDesk"
            desc "Local-first markdown vault workspace"
            homepage "https://github.com/danieljustus/symaira-desktop"

            livecheck do
              url "https://github.com/danieljustus/symaira-desktop/releases/latest"
              strategy :header_match
              regex(/SymDesk-(\d+(?:\.\d+)*)\.dmg/i)
            end

            depends_on macos: :sonoma

            app "SymDesk.app"

            zap trash: [
              "~/Library/Application Support/SymDesk",
              "~/Library/Preferences/com.symaira.desktop.plist",
              "~/Library/Caches/com.symaira.desktop",
            ]
          end
          EOF

      - name: Commit and push cask
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symdesk-app.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump symdesk-app to v${VERSION}"
          git push
