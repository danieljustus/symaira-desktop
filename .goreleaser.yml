version: 2

project_name: symaira-desktop

before:
  hooks:
    - go mod tidy

builds:
  - id: symdesk
    main: ./cmd/symdesk
    binary: symdesk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && [ -n "${CODESIGN_IDENTITY:-}" ]; then codesign -s "$CODESIGN_IDENTITY" --timestamp --options runtime "{{ .Path }}"; echo "Signed {{ .Path }}"; fi'

  # symroom is the one absorbed tool without an in-process call site: the room
  # layer is its own surface, not something symdesk drives. The Homebrew
  # formula `symroom` is deprecated in favour of symdesk, so the binary has to
  # travel in this release for that deprecation to be honest.
  - id: symroom
    dir: ./room
    main: ./cmd/symroom
    binary: symroom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/danieljustus/symaira-room/internal/version.Version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && [ -n "${CODESIGN_IDENTITY:-}" ]; then codesign -s "$CODESIGN_IDENTITY" --timestamp --options runtime "{{ .Path }}"; echo "Signed {{ .Path }}"; fi'

archives:
  - id: default
    ids: [symdesk, symroom]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - VAULT.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: danieljustus
    name: symaira-desktop
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"

# Homebrew CLI Formula. The macOS app Cask is updated by the dedicated
# bump-homebrew-cask job in .github/workflows/release.yml.
brews:
  - name: symdesk
    repository:
      owner: danieljustus
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/danieljustus/symaira-desktop
    description: "Local-first markdown vault workspace: CLI and MCP server"
    license: Apache-2.0
    test: |
      system "#{bin}/symdesk", "version"
