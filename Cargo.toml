[workspace]
members = ["crates/symdesk-cli", "crates/symdesk-core", "crates/symdesk-vault", "crates/symroom-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-desktop"

[workspace.dependencies]
clap = { version = "=4.6.6" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["macros", "parsing"] }
toml = "=1.1.5"
noyalib = "=0.0.35"
unicode-general-category = "=1.1.0"
symdesk-core = { path = "crates/symdesk-core", version = "=0.0.0" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
