[workspace]
members = ["crates/symdesk-cli", "crates/symdesk-core", "crates/symdesk-index", "crates/symdesk-vault", "crates/symdesk-protocol", "crates/symroom-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-desktop"

[workspace.dependencies]
symaira-core-version = { git = "https://github.com/danieljustus/symaira-corekit", rev = "d382b8615ce879bac6f23c7250e13667934e8f93", version = "=0.0.0" }
clap = { version = "=4.6.6" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing"] }
toml = "=1.1.5"
noyalib = "=0.0.35"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
unicode-general-category = "=1.1.0"
symdesk-core = { path = "crates/symdesk-core", version = "=0.0.0" }
symdesk-vault = { path = "crates/symdesk-vault", version = "=0.0.0" }
symdesk-index = { path = "crates/symdesk-index", version = "=0.0.0" }
symdesk-protocol = { path = "crates/symdesk-protocol", version = "=0.0.0" }
cap-std = { version = "=4.0.3", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
flate2 = "=1.1.2"
httpdate = "=1.0.3"
tokio = { version = "=1.47.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "=0.5.2", default-features = false, features = ["timeout"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
