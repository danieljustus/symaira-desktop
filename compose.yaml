services:
  symdesk-server:
    build: .
    image: ghcr.io/danieljustus/symaira-desktop:latest
    restart: unless-stopped
    environment:
      SYMDESK_SERVER_TOKEN: ${SYMDESK_SERVER_TOKEN:?set a random token with at least 32 characters}
      # Optional: a separate credential that only authorizes the OCR worker
      # routes (lease/download/complete/fail). Leave unset to keep workers
      # using SYMDESK_SERVER_TOKEN during migration.
      SYMDESK_WORKER_TOKEN: ${SYMDESK_WORKER_TOKEN:-}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  symdesk-local-worker:
    build: .
    image: ghcr.io/danieljustus/symaira-desktop:latest
    profiles: ["local-processing"]
    restart: unless-stopped
    depends_on:
      symdesk-server:
        condition: service_healthy
    command:
      - worker
      - --server
      - http://symdesk-server:8787
      - --engine
      - tesseract
    environment:
      # Prefers the worker-scoped credential; falls back to the admin/client
      # token for deployments that have not set SYMDESK_WORKER_TOKEN yet.
      SYMDESK_SERVER_TOKEN: ${SYMDESK_WORKER_TOKEN:-$SYMDESK_SERVER_TOKEN}
      SYMDESK_OCR_LANGUAGE: ${SYMDESK_OCR_LANGUAGE:-deu+eng}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
