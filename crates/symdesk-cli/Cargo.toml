[package]
name = "symdesk-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "symdesk"
path = "src/main.rs"

[dependencies]
cap-std.workspace = true
clap.workspace = true
libc = "=0.2.189"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
toml.workspace = true
symdesk-core.workspace = true
symdesk-contacts.workspace = true
symaira-core-exit.workspace = true
symdesk-index.workspace = true
symdesk-ingest.workspace = true
symdesk-protocol.workspace = true
symdesk-render.workspace = true
symdesk-service.workspace = true
symdesk-vault.workspace = true
symaira-core-llm.workspace = true
time.workspace = true
tokio.workspace = true
rusqlite.workspace = true
noyalib.workspace = true
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
notify.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
regex.workspace = true
flate2.workspace = true
rustls.workspace = true
sha2.workspace = true
