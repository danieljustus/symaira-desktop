[package]
name = "symdesk-ingest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hex.workspace = true
base64.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
symaira-core-sqlite.workspace = true
symdesk-core.workspace = true
regex.workspace = true
scraper = "0.29.0"
quick-xml = "=0.42.0"
miniz_oxide = "=0.9.1"
crc32fast = "=1.5.5"
sha2.workspace = true
symdesk-vault.workspace = true
noyalib.workspace = true
time.workspace = true
ureq = { version = "=3.4.1", default-features = false, features = ["rustls", "gzip"] }
url = "=2.5.8"
symdesk-render.workspace = true
symaira-core-llm.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rxing = { version = "=0.9.4", default-features = false, features = ["qrcode", "datamatrix", "oned", "decoders", "encoding_rs"] }

rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
notify.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
