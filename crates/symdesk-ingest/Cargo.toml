[package]
name = "symdesk-ingest"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
symaira-core-sqlite.workspace = true
symdesk-core.workspace = true
regex.workspace = true
scraper = "0.29.0"
quick-xml = "=0.41.0"
miniz_oxide = "=0.8.9"
crc32fast = "=1.5.3"
sha2.workspace = true
symdesk-vault.workspace = true
noyalib.workspace = true
time.workspace = true
ureq = { version = "=3.4.1", default-features = false, features = ["rustls", "gzip"] }
url = "=2.5.8"
symdesk-render.workspace = true
symaira-core-llm.workspace = true
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
rxing = { version = "=0.9.3", default-features = false, features = ["qrcode", "datamatrix", "oned", "decoders", "encoding_rs"] }

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
