[package]
name = "symdesk-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "=1.12.1"
tokio.workspace = true
# Pure-Rust PostgreSQL client (no libpq, no native TLS): the Go store uses the
# pure-Go pgx, and the Linux/macOS gates must not need a system PostgreSQL
# library. TLS (sslmode=require/verify-*) is a declared gap, see lib.rs.
tokio-postgres.workspace = true

[dev-dependencies]
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
