[graph]
all-features = true

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]

# Reviewed native watcher dependencies; keep exceptions package-scoped.
[[licenses.exceptions]]
name = "notify"
version = "=8.2.0"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "inotify"
version = "=0.11.5"
allow = ["ISC"]

[[licenses.exceptions]]
name = "inotify-sys"
version = "=0.1.8"
allow = ["ISC"]

# Reviewed ISC code in the pinned Rustls crypto providers (LICENSE files in
# these crate releases). Keep this scoped to the exact resolved packages;
# Apache-2.0/MIT/BSD-3-Clause alternatives are already allowed above.
[[licenses.exceptions]]
name = "aws-lc-rs"
version = "=1.18.1"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-sys"
version = "=0.45.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "ring"
version = "=0.17.14"
allow = ["ISC"]

[[licenses.exceptions]]
name = "rustls-webpki"
version = "=0.103.16"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
version = "=0.9.0"
allow = ["ISC"]

# Mozilla CA certificate data is redistributed under CDLA-Permissive-2.0;
# these pinned root bundles retain the upstream license notice.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.10"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.10"
allow = ["CDLA-Permissive-2.0"]

# Pinned HTML extraction dependencies: ISC notices and Mozilla's MPL-2.0
# file-level license remain upstream; no global copyleft allowance.
[[licenses.exceptions]]
name = "scraper"
version = "=0.29.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "ego-tree"
version = "=0.11.1"
allow = ["ISC"]

[[licenses.exceptions]]
name = "cssparser"
version = "=0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.41.0"
allow = ["MPL-2.0"]

# ZIP/PDF deflate backend, retaining the zlib notice in these exact releases.
[[licenses.exceptions]]
name = "libz-rs-sys"
version = "=0.5.5"
allow = ["Zlib"]

[[licenses.exceptions]]
name = "zlib-rs"
version = "=0.5.5"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Private CoreKit staging adoption; Cargo.toml and Cargo.lock pin the exact revision.
allow-git = ["https://github.com/danieljustus/symaira-corekit"]
required-git-spec = "rev"
