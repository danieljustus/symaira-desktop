[package]
name = "symdesk-vault-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"
rust-version = "1.98"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
symdesk-vault = { path = "../crates/symdesk-vault" }
symroom-core = { path = "../crates/symroom-core" }
symdesk-render = { path = "../crates/symdesk-render" }

[[bin]]
name = "draw_parser"
path = "fuzz_targets/draw_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontmatter"
path = "fuzz_targets/frontmatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "room_event"
path = "fuzz_targets/room_event.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
