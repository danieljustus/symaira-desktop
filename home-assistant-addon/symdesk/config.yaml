name: SymDesk Server
version: "0.7.3"
slug: symdesk
description: Self-hosted Markdown document vault with optional local or remote OCR workers
url: https://github.com/danieljustus/symaira-desktop
image: ghcr.io/danieljustus/symaira-desktop
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
legacy: true
stage: experimental
backup: cold
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: SymDesk API
options:
  server_token: null
  worker_token: null
  listen: 0.0.0.0:8787
  vault: /data/vault
  local_processing: false
  worker_engine: tesseract
  ollama_url: http://127.0.0.1:11434
  ollama_model: ""
schema:
  server_token: password
  worker_token: password?
  listen: str
  vault: str
  local_processing: bool
  worker_engine: list(tesseract|ollama)
  ollama_url: url
  ollama_model: str?
