name: SymDesk
options:
  bundleIdPrefix: com.symaira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  symaira-appkit:
    url: https://github.com/danieljustus/symaira-appkit
    # 0.14.0 — shared exact-pinned appkit graph. 0.13.0 added
    # SymairaProviderKit (provider settings layer, #119); 0.14.0 added
    # verified keychain saves and bounded reads. Additive, no breaking
    # changes per CHANGELOG.
    exactVersion: 0.14.0
  symaira-meet:
    url: https://github.com/danieljustus/symaira-meet
    path: meet
  # room/client is the SwiftUI module for the signed project journal. symroom
  # ships as a binary in the symdesk release (it is the one absorbed tool with
  # no in-process call site), so this module bridges the CLI rather than
  # linking Go code. Its appkit pin matches the shared exact-pinned graph.
  symaira-room-client:
    path: room/client

targets:
  SymDeskCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/SymDeskCore
    dependencies:
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
      - package: symaira-appkit
        product: SymairaKeychain
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDesk:
    type: application
    platform: macOS
    sources:
      - Sources/SymDeskApp
    dependencies:
      - target: SymDeskCore
      - package: symaira-room-client
        product: SymroomFeature
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
      - package: symaira-appkit
        product: SymairaKeychain
      - package: symaira-appkit
        product: SymairaProviderKit
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop
        # Brand layer is "Symaira Desktop" (issue #592): the display name,
        # release DMG and cask advertise the product name, while the binary,
        # bundle, bundle id and Swift module keep the short form. PRODUCT_NAME
        # stays SymDesk so the executable path and the app test bundle_loader
        # keep working; CFBundleDisplayName in Info.plist is what users see.
        PRODUCT_NAME: SymDesk
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SymDeskCoreTests
    dependencies:
      - target: SymDeskCore
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
      - package: symaira-appkit
        product: SymairaKeychain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDeskAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SymDeskAppTests
    dependencies:
      - target: SymDesk
      - target: SymDeskCore
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
      - package: symaira-appkit
        product: SymairaKeychain
      - package: symaira-appkit
        product: SymairaProviderKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDeskMobile:
    type: application
    platform: iOS
    sources:
      - Sources/SymDeskMobile
    resources:
      - Sources/SymDeskMobile/PrivacyInfo.xcprivacy
    dependencies:
      - package: symaira-appkit
        product: SymairaKeychain
      - target: SymDeskMobileShare
      - target: SymDeskWidget
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop.ios
        PRODUCT_NAME: SymDesk
        PRODUCT_MODULE_NAME: SymDeskMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/SymDeskMobile/AppGroup.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskMobileShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/SymDeskMobileShare
    resources:
      - Sources/SymDeskMobileShare/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskMobileShare/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop.ios.share
        PRODUCT_NAME: SymDeskShare
        PRODUCT_MODULE_NAME: SymDeskMobileShare
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/SymDeskMobile/AppGroup.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/SymDeskWidget
      # Shared with the app target so widget buttons and Shortcuts/Siri
      # intents are the same types (one shared-container decision).
      - Sources/SymDeskMobile/MobileAppIntents.swift
      - Sources/SymDeskMobile/MobileRecentsStore.swift
    resources:
      - Sources/SymDeskWidget/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop.ios.widget
        PRODUCT_NAME: SymDeskWidget
        PRODUCT_MODULE_NAME: SymDeskWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/SymDeskMobile/AppGroup.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SymDeskMobileTests
    dependencies:
      - target: SymDeskMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SymDesk.app/SymDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SymDesk:
    build:
      targets:
        SymDesk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymDeskCoreTests
        - SymDeskAppTests

  SymDeskCore:
    build:
      targets:
        SymDeskCore: all
    test:
      config: Debug
      targets:
        - SymDeskCoreTests

  SymDeskMobile:
    build:
      targets:
        SymDeskMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymDeskMobileTests
