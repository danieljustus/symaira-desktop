name: SymDesk
options:
  bundleIdPrefix: com.symaira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  symaira-appkit:
    url: https://github.com/danieljustus/symaira-appkit
    branch: main

targets:
  SymDeskCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/SymDeskCore
    dependencies:
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDesk:
    type: application
    platform: macOS
    sources:
      - Sources/SymDeskApp
    dependencies:
      - target: SymDeskCore
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SymDeskCoreTests
    dependencies:
      - target: SymDeskCore
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDeskAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SymDeskAppTests
    dependencies:
      - target: SymDesk
      - target: SymDeskCore
      - package: symaira-appkit
        product: SymairaTheme
      - package: symaira-appkit
        product: SymairaCLIRunner
      - package: symaira-appkit
        product: SymairaToolKit
      - package: symaira-appkit
        product: SymairaUpdateCheck
      - package: symaira-appkit
        product: SymairaIngestContract
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"

  SymDeskMobile:
    type: application
    platform: iOS
    sources:
      - Sources/SymDeskMobile
    settings:
      base:
        INFOPLIST_FILE: Sources/SymDeskMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.desktop.ios
        PRODUCT_NAME: SymDesk
        PRODUCT_MODULE_NAME: SymDeskMobile
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "1"

  SymDeskMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SymDeskMobileTests
    dependencies:
      - target: SymDeskMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SymDesk.app/SymDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SymDesk:
    build:
      targets:
        SymDesk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymDeskCoreTests
        - SymDeskAppTests

  SymDeskCore:
    build:
      targets:
        SymDeskCore: all
    test:
      config: Debug
      targets:
        - SymDeskCoreTests

  SymDeskMobile:
    build:
      targets:
        SymDeskMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymDeskMobileTests
